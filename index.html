<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Munlawin</title>
  <style>
    html {
      min-height: 100%;
      background: linear-gradient(to bottom, #DF4B4A 0%, #000000 100%) fixed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
        flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      background: transparent;
    }

    video {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <video autoplay muted loop controls width="800">
    <source src="Munlawin.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <button id="music-toggle" type="button">Play music</button>
  <audio id="bg-audio" src="Munlawin.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById("bg-audio");
    const musicToggle = document.getElementById("music-toggle");

    musicToggle.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
          musicToggle.textContent = "Pause music";
        } catch (error) {
          musicToggle.textContent = "Could not play music — try again";
        }
      } else {
        audio.pause();
        musicToggle.textContent = "Play music";
      }
    });

    audio.addEventListener("play", () => {
      musicToggle.textContent = "Pause music";
    });
    audio.addEventListener("pause", () => {
      musicToggle.textContent = "Play music";
    });
  </script>
</body>
</html>
